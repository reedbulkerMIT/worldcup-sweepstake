name: Diag score structure

# 一次性診斷用:印出指定淘汰賽場次的完整 score 物件,確認 football-data
# 免費版到底有沒有 penalties / regularTime 等細項。只能手動觸發、唯讀、不寫檔。
# 診斷完即可刪除此檔。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dump score objects for NED & GER knockout matches
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          python - <<'PY'
          import os, json, urllib.request
          tok = os.environ["FOOTBALL_DATA_TOKEN"]
          req = urllib.request.Request(
              "https://api.football-data.org/v4/competitions/WC/matches",
              headers={"X-Auth-Token": tok})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          ms = data.get("matches", [])
          print("total matches:", len(ms))

          def tla(t): return (t or {}).get("tla")
          def nm(t):  return (t or {}).get("name")

          # 目標:荷蘭vs摩洛哥、德國vs巴拉圭(用 tla 配對,任一場有就印)
          targets = [{"GER", "PAR"}, {"NED", "MAR"}]
          for m in ms:
              pair = {tla(m.get("homeTeam")), tla(m.get("awayTeam"))}
              if pair in targets:
                  print("\n" + "=" * 60)
                  print(f"{nm(m.get('homeTeam'))} ({tla(m.get('homeTeam'))}) "
                        f"vs {nm(m.get('awayTeam'))} ({tla(m.get('awayTeam'))})")
                  print("status :", m.get("status"))
                  print("stage  :", m.get("stage"))
                  print("utcDate:", m.get("utcDate"))
                  print("--- full score object (raw) ---")
                  print(json.dumps(m.get("score"), ensure_ascii=False, indent=2))
                  print("--- score top-level keys ---")
                  print(sorted((m.get("score") or {}).keys()))
          PY
