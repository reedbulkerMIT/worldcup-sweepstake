name: Dump KO (diagnostic)

# 唯讀診斷:只在手動觸發時跑,印出 API /matches 的 KO 段原始樣貌。
# 不寫 data.json、不 commit、不部署。確認 API 是否已填「單邊勝方」對戰後即可刪除本檔。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Dump KO-stage matches from live API
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_data.py --dump-ko
