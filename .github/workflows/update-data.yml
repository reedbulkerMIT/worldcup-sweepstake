name: Update data.json

on:
  # cron 為 UTC;設定為每小時一次(分鐘挪到 17 避開整點全平台壅塞時段)。
  # 註:GitHub 排程為 best-effort,實際到手會比設定稀疏、班次不固定,屬平台已知行為。
  # update_data.py 內建無變化保護:無新賽果時 data.json 位元組不變,
  # 下方 commit 步驟會 git diff 判定無變更而跳過 → 不會重新部署。
  schedule:
    - cron: "17 * * * *"
  # 讓你能從 GitHub Actions 頁(手機也可)手動觸發
  workflow_dispatch:

# contents: write → commit + push 更新後的 data.json
# actions: write  → 用 gh workflow run 觸發 deploy.yml(workflow_dispatch)
permissions:
  contents: write
  actions: write

# 同一時間只跑一個 update-data,避免兩個 run 同時 push 造成 non-fast-forward 被拒。
# cancel-in-progress: false → 後到的排隊等候,不打斷進行中的(避免 push 到一半被砍)。
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Fetch latest results → public/data.json
        env:
          # token 只從 Secrets 經環境變數傳入,絕不寫進檔案
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/update_data.py

      - name: Commit data.json if changed
        id: commit
        env:
          # 重試時要重新產生 data.json,故此步也需要 token(同樣只經環境變數)
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="${GITHUB_REF_NAME:-main}"
          changed=false
          # 若 push 被拒(別的 run/人先推到同一分支),整合最新後重產再推,最多 5 次。
          # 重產會以最新 data.json 做單調聯集,已完賽不會因競態而掉場。
          for attempt in 1 2 3 4 5; do
            git add public/data.json
            if git diff --cached --quiet; then
              echo "data.json 無變更,跳過 commit。"
              break
            fi
            git commit -m "chore: update data.json [skip ci]"
            if git push origin "HEAD:$branch"; then
              echo "已推送 (attempt $attempt)。"
              changed=true
              break
            fi
            echo "::warning::push 被拒(他人先推到 $branch),整合最新後重試 ($attempt/5)…"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"   # 捨棄本地 commit,取得最新 data.json
            python scripts/update_data.py        # 以最新內容重產(維持單調聯集)
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 造成的 push 不會自動觸發 deploy.yml(GitHub 防遞迴),
      # 所以資料有變更時顯式 dispatch 一次部署(workflow_dispatch 是允許的例外)。
      - name: Trigger Pages redeploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
